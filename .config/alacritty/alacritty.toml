[keyboard]
bindings = [
  { key = "Return", mods = "Command", action = "ToggleSimpleFullscreen" },
  # Unbind macOS default Cmd+K because I ~never want ClearHistory
  { key = "K", mods = "Command", mode = "~Vi|~Search", action = "None" },
  # Alacritty does not seem to accept Shift+Enter by default on macOS.
  # Add explicit bind.
  { key = "Return", mods = "Shift", chars = "\u001b\r" },
  { key = "Return", mods = "Alt", chars = "\u001b\r" },
]

[font.normal]
family = "Greybeard 13px" # greybeard sizes are 11,12,13,14,15,16,17,18,22
# family = "Menlo"
# family = "Monaco"
# family = "Iosevka Light"
# family = "Space Mono"
# family = "Monaspace Argon Var"
# family = "Monaspace Krypton Var"
# family = "Geist Mono"

[font]
size = 15
# offset.x = -1
# offset.y = -1

[window]
decorations = "none"
startup_mode = "SimpleFullscreen"

[general]
import = ["~/dotfiles/.config/alacritty/generated-theme.toml"]
